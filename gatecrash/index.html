<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Gatecrash</title>
<style>
  html,body{margin:0;height:100%;background:#050813;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent;outline:none}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   GATECRASH: thread the ball through the gates into the fortress.
   ===================================================================== */

/* ---------- constants ---------- */
const W = 480, H = 800;
const WALL_Y = 444, WALL_H = 44, WALL_B = WALL_Y + WALL_H;   // fortress floor band (gates are gaps in it)
const PAD_Y = 738, PAD_H = 14, PAD_W0 = 86, PAD_WIDE = 140;
const R = 7;                                                  // ball radius
const ORB_R = 13;
const BW = 42, BH = 22, BX0 = 30, BY0 = 78, COLS = 10;
const MAX_BALLS = 16;
const TAU = Math.PI * 2;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- orbs ---------- */
const ORB = {
  x2:     { label: 'x2',  name: 'BALLS x2',    col: '#2dd4bf', w: 30 },
  x3:     { label: 'x3',  name: 'BALLS x3',    col: '#a78bfa', w: 12 },
  pierce: { label: 'PRC', name: 'PIERCE',      col: '#f472b6', w: 13 },
  wide:   { label: 'WID', name: 'WIDE PADDLE', col: '#60a5fa', w: 15 },
  slow:   { label: 'SLO', name: 'SLOW-MO',     col: '#fbbf24', w: 10 },
  blast:  { label: 'BLT', name: 'BLAST BALLS', col: '#fb7185', w: 11 },
  shield: { label: 'SHD', name: 'SHIELD',      col: '#e2e8f0', w: 9 },
};
function pickOrb() {
  let tot = 0; for (const k in ORB) tot += ORB[k].w;
  let r = Math.random() * tot;
  for (const k in ORB) { r -= ORB[k].w; if (r <= 0) return k; }
  return 'x2';
}

/* ---------- levels ---------- */
// mv = { a: amplitude px, s: speed rad/s, p: phase }
const gate3 = (sw, cw, mv = {}) => [
  { cx: 84,  w: sw, k: 'od',  mv: mv.l },
  { cx: 240, w: cw, k: 'std', mv: mv.c },
  { cx: 396, w: sw, k: 'od',  mv: mv.r },
];
const M = (a, s, p) => ({ a, s, p });
const LEVELS = [
  { name: 'Breach', gates: gate3(84, 100), rows: [
    '1111111111',
    '1111111111',
    '11M1111M11',
    '1111111111',
    '1111111111' ] },
  { name: 'Thick Walls', gates: gate3(76, 100), rows: [
    '2222222222',
    '1111111111',
    '1M11111M11',
    '1111111111',
    '2222222222' ] },
  { name: 'Pillars', gates: gate3(68, 96), rows: [
    '1111111111',
    '1S111111S1',
    '1S1M11M1S1',
    '1S111111S1',
    '2222222222',
    '1111111111' ] },
  { name: 'Shutter', gates: gate3(66, 96, { c: M(26, 1.4, 0) }), rows: [
    '....11....',
    '...1221...',
    '..122221..',
    '.12233221.',
    '1223MM3221',
    '.12233221.',
    '..122221..',
    '...1221...',
    '....11....' ] },
  { name: 'Powder Keg', gates: gate3(64, 96, { l: M(24, 1.0, 0), r: M(24, 1.0, Math.PI) }), rows: [
    '1X1X11X1X1',
    '2222222222',
    '1X1X11X1X1',
    '3333333333',
    'M1M1111M1M' ] },
  { name: 'The Citadel', gates: [ { cx: 84, w: 64, k: 'od' }, { cx: 396, w: 64, k: 'od' } ], rows: [
    'SSSS..SSSS',
    'S22M..M22S',
    'S1X1..1X1S',
    'S22M..M22S',
    'SSSS..SSSS' ] },
  { name: 'Revolving Doors', gates: gate3(60, 90, { l: M(22, 1.1, 0), c: M(22, 1.6, 2), r: M(22, 1.1, Math.PI) }), rows: [
    '2121212121',
    '1212121212',
    '2X2M22M2X2',
    '1212121212',
    '3131313131',
    '1313131313' ] },
];
function genLevel(n) {
  const r = mulberry(n * 7919 + 101);
  const hd = Math.min(1, (n - 7) / 12);
  const nrows = 6 + Math.min(4, (n - 8) >> 1);
  const rows = []; let breakable = 0;
  for (let ri = 0; ri < nrows; ri++) {
    const half = [];
    for (let ci = 0; ci < 5; ci++) {
      const w = [['.', 0.15], ['1', 0.34 - 0.2 * hd], ['2', 0.24], ['3', 0.1 + 0.2 * hd], ['X', 0.07], ['M', 0.06], ['S', (ci === 0 && ri > 0) ? 0.07 : 0]];
      let tot = 0; for (const e of w) tot += e[1];
      let x = r() * tot, ch = '1';
      for (const e of w) { x -= e[1]; if (x <= 0) { ch = e[0]; break; } }
      half.push(ch);
    }
    const row = half.join('') + half.slice().reverse().join('');
    for (const ch of row) if (ch !== '.' && ch !== 'S') breakable++;
    rows.push(row);
  }
  if (breakable < 10) rows[0] = '1111111111';
  const kind = Math.floor(r() * 5);
  let gates;
  if (kind === 0) gates = gate3(60, 92);
  else if (kind === 1) gates = gate3(60, 90, { l: M(22, 1.1, 0), c: M(22, 1.5, 2), r: M(22, 1.1, Math.PI) });
  else if (kind === 2) gates = [ { cx: 90, w: 64, k: 'od', mv: M(26, 1.0, 0) }, { cx: 390, w: 64, k: 'od', mv: M(26, 1.0, Math.PI) } ];
  else if (kind === 3) gates = [ { cx: 240, w: 84, k: 'od', mv: M(70, 0.8, 0) } ];
  else gates = [ { cx: 140, w: 70, k: 'od' }, { cx: 340, w: 70, k: 'std' } ];
  return { name: 'Siege ' + (n - 7), rows, gates };
}
const getLevel = n => n <= LEVELS.length ? LEVELS[n - 1] : genLevel(n);

/* ---------- state ---------- */
const G = {
  state: 'menu', prevState: 'serve', stateT: 0, time: 0,
  level: 1, score: 0, lives: 3, best: 0, newBest: false,
  balls: [], blocks: [], orbs: [], parts: [], texts: [], blasts: [],
  gates: [], walls: [], levelName: '', remaining: 0,
  fx: { pierce: 0, wide: 0, slow: 0, blast: 0 },
  fxMax: { pierce: 8, wide: 12, slow: 8, blast: 8 },
  shield: 0, boost: 1, speed: 370, timeScale: 1,
  pad: { x: W / 2, tx: W / 2, w: PAD_W0 },
  shake: 0, banner: null, keys: { l: false, r: false }, muted: false,
  scale: 1,
};
try { G.best = +localStorage.getItem('gatecrash.best') || 0; G.muted = localStorage.getItem('gatecrash.mute') === '1'; } catch (e) {}
const saveBest = () => { try { localStorage.setItem('gatecrash.best', String(G.best)); } catch (e) {} };

/* ---------- audio ---------- */
let AC = null; const lastSfx = {};
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
  return AC;
}
function tone(f, d, type, v, slide, delay) {
  const a = AC; if (!a) return;
  try {
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
function sfx(n, k) {
  if (G.muted || !AC) return;
  const now = performance.now();
  if (lastSfx[n] && now - lastSfx[n] < 30) return;
  lastSfx[n] = now;
  switch (n) {
    case 'wall':   tone(190, 0.05, 'triangle', 0.04); break;
    case 'paddle': tone(250, 0.09, 'triangle', 0.07, 130); break;
    case 'hit':    tone(330, 0.05, 'square', 0.03); break;
    case 'steel':  tone(120, 0.07, 'sawtooth', 0.03); break;
    case 'break':  tone(420 + Math.min(k || 0, 16) * 22, 0.1, 'square', 0.04, 220); break;
    case 'boom':   tone(110, 0.3, 'sawtooth', 0.07, -70); break;
    case 'gate':   tone(300, 0.16, 'sawtooth', 0.035, 380); break;
    case 'od':     tone(260, 0.28, 'sawtooth', 0.05, 700); tone(520, 0.2, 'square', 0.025, 400, 0.05); break;
    case 'orb':    tone(520, 0.1, 'triangle', 0.06); tone(660, 0.1, 'triangle', 0.06, 0, 0.07); tone(880, 0.16, 'triangle', 0.06, 0, 0.14); break;
    case 'lose':   tone(240, 0.55, 'sawtooth', 0.06, -170); break;
    case 'clear':  tone(520, 0.12, 'square', 0.05); tone(660, 0.12, 'square', 0.05, 0, 0.12); tone(790, 0.12, 'square', 0.05, 0, 0.24); tone(1040, 0.3, 'square', 0.05, 0, 0.36); break;
    case 'shield': tone(700, 0.2, 'triangle', 0.06, -400); break;
  }
}

/* ---------- sprites & background ---------- */
let bg = null; const SPR = {};
function mkSprite(fn) {
  const S = 3, c = document.createElement('canvas'); c.width = BW * S; c.height = BH * S;
  const x = c.getContext('2d'); x.scale(S, S); fn(x); return c;
}
function blockSprite(top, bot, decor) {
  return mkSprite(x => {
    const g = x.createLinearGradient(0, 0, 0, BH); g.addColorStop(0, top); g.addColorStop(1, bot);
    x.fillStyle = g; rr(x, 1.5, 1.5, BW - 3, BH - 3, 4); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.3)'; rr(x, 3.5, 3, BW - 7, 3, 1.5); x.fill();
    x.strokeStyle = 'rgba(0,0,0,0.4)'; x.lineWidth = 1; rr(x, 1.5, 1.5, BW - 3, BH - 3, 4); x.stroke();
    if (decor) decor(x);
  });
}
function buildSprites() {
  SPR.N1 = blockSprite('#5eead4', '#0f9488');
  SPR.N2 = blockSprite('#a5b4fc', '#4f46e5');
  SPR.N3 = blockSprite('#f9a8d4', '#be185d');
  SPR.S = blockSprite('#94a3b8', '#475569', x => {
    x.save(); rr(x, 1.5, 1.5, BW - 3, BH - 3, 4); x.clip();
    x.strokeStyle = 'rgba(15,23,42,0.35)'; x.lineWidth = 2;
    for (let i = -BH; i < BW; i += 8) { x.beginPath(); x.moveTo(i, BH); x.lineTo(i + BH, 0); x.stroke(); }
    x.restore();
  });
  SPR.X = blockSprite('#fdba74', '#ea580c', x => {
    x.fillStyle = '#2a1320'; x.beginPath(); x.arc(BW / 2, BH / 2 + 1, 5, 0, TAU); x.fill();
    x.strokeStyle = '#fde047'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(BW / 2 + 3, BH / 2 - 3); x.lineTo(BW / 2 + 6, BH / 2 - 6); x.stroke();
    x.fillStyle = '#fef08a'; x.beginPath(); x.arc(BW / 2 + 6.5, BH / 2 - 6.5, 1.6, 0, TAU); x.fill();
  });
  SPR.M = blockSprite('#fde68a', '#d97706', x => {
    x.strokeStyle = '#fff'; x.lineWidth = 1.6; x.beginPath(); x.arc(BW / 2, BH / 2, 5.5, 0, TAU); x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(BW / 2, BH / 2, 2, 0, TAU); x.fill();
  });
}
function buildBackground() {
  bg = document.createElement('canvas'); bg.width = canvas.width; bg.height = canvas.height;
  const c = bg.getContext('2d'); c.scale(G.scale, G.scale);
  let g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1431'); g.addColorStop(WALL_Y / H, '#0a1028'); g.addColorStop(1, '#05070f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createLinearGradient(0, 0, 0, WALL_Y);
  g.addColorStop(0, '#18235a'); g.addColorStop(1, '#0f1a40');
  c.fillStyle = g; c.fillRect(0, 0, W, WALL_Y);
  c.strokeStyle = 'rgba(130,160,255,0.07)'; c.lineWidth = 1;
  for (let x = BX0; x <= W - BX0 + 1; x += BW) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, WALL_Y); c.stroke(); }
  for (let y = BY0; y < WALL_Y; y += BH) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.strokeStyle = 'rgba(100,130,220,0.05)';
  for (let y = WALL_B + 30; y < H; y += 30) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.fillStyle = 'rgba(45,212,191,0.35)'; c.fillRect(0, 0, 2, WALL_B); c.fillRect(W - 2, 0, 2, WALL_B);
  c.fillStyle = 'rgba(45,212,191,0.5)'; c.fillRect(0, 0, W, 2);
  c.fillStyle = 'rgba(100,130,220,0.18)'; c.fillRect(0, H - 1, W, 1);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
  G.scale = canvas.width / W;
  buildBackground();
}

/* ---------- level / game flow ---------- */
function makeBall(stuck) {
  return { x: G.pad.x, y: PAD_Y - R - 1, vx: 0, vy: 0, od: false, combo: 0, zone: 'yard', dead: false, stuck, trail: [] };
}
function serve() {
  G.balls = [makeBall(true)]; G.state = 'serve'; G.stateT = 0;
  G.boost = 1; G.orbs = []; G.blasts = [];
  G.fx = { pierce: 0, wide: 0, slow: 0, blast: 0 }; G.shield = 0;
}
function loadLevel(n) {
  const L = getLevel(n);
  G.level = n; G.levelName = L.name; G.speed = Math.min(540, 360 + (n - 1) * 14);
  G.blocks = []; G.remaining = 0;
  L.rows.forEach((row, ri) => {
    for (let ci = 0; ci < COLS; ci++) {
      const ch = row[ci];
      if (!ch || ch === '.' || ch === ' ') continue;
      const type = ch === 'S' ? 'S' : ch === 'X' ? 'X' : ch === 'M' ? 'M' : 'N';
      const hp = (ch >= '1' && ch <= '3') ? +ch : 1;
      G.blocks.push({ x: BX0 + ci * BW, y: BY0 + ri * BH, hp, maxhp: hp, type, alive: true, flash: 0, lastP: -9 });
      if (type !== 'S') G.remaining++;
    }
  });
  G.gates = L.gates.map(g => ({ cx: g.cx, w: g.w, k: g.k, mv: g.mv || null, x: g.cx }));
  G.parts.length = 0; G.texts.length = 0;
  updateGates();
  G.banner = { text: 'LEVEL ' + n, sub: L.name, t: 2.0 };
  serve();
}
function newGame() {
  G.score = 0; G.lives = 3; G.newBest = false;
  loadLevel(1);
}
function launch() {
  if (G.state !== 'serve') return;
  const b = G.balls[0]; if (!b) return;
  b.stuck = false;
  const ang = -Math.PI / 2 + (G.keys.l ? -0.2 : G.keys.r ? 0.2 : rand(-0.1, 0.1));
  const sp = G.speed * G.boost;
  b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
  G.state = 'play'; sfx('paddle');
}
function loseLife() {
  G.lives--; sfx('lose'); G.shake = 8;
  G.orbs = []; G.blasts = [];
  if (G.lives <= 0) {
    G.state = 'over'; G.stateT = 0; saveBest();
  } else {
    G.banner = { text: 'BALL LOST', sub: G.lives + (G.lives === 1 ? ' life left' : ' lives left'), t: 1.4 };
    serve();
  }
}
function levelClear() {
  G.state = 'clear'; G.stateT = 0;
  const bonus = 300 + 100 * G.lives;
  addScore(bonus);
  for (const b of G.balls) burst(b.x, b.y, '#fff', 8);
  G.balls = []; G.orbs = []; G.blasts = [];
  G.banner = { text: 'FORTRESS BREACHED', sub: '+' + bonus + ' bonus', t: 2.5 };
  sfx('clear'); saveBest();
}
function pause() { if (G.state === 'play' || G.state === 'serve') { G.prevState = G.state; G.state = 'paused'; } }
function resume() { if (G.state === 'paused') { G.state = G.prevState; } }
function addScore(n) {
  G.score += n;
  if (G.score > G.best) { G.best = G.score; G.newBest = true; }
}

/* ---------- gates & walls ---------- */
function updateGates() {
  const t = G.time;
  for (const g of G.gates) g.x = g.cx + (g.mv ? g.mv.a * Math.sin(t * g.mv.s + g.mv.p) : 0);
  const walls = []; let prev = 0;
  for (const g of G.gates) {
    const l = g.x - g.w / 2, r = g.x + g.w / 2;
    if (l > prev + 0.5) walls.push({ x: prev, y: WALL_Y, w: l - prev, h: WALL_H });
    prev = r;
  }
  if (W > prev + 0.5) walls.push({ x: prev, y: WALL_Y, w: W - prev, h: WALL_H });
  G.walls = walls;
}

/* ---------- effects ---------- */
function burst(x, y, col, n, sp) {
  if (G.parts.length > 320) return;
  sp = sp || 190;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = sp * rand(0.3, 1.1);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.8), max: 0.8, col, size: rand(1.8, 4) });
  }
}
function floatText(x, y, text, col, size) {
  if (G.texts.length > 24) G.texts.shift();
  G.texts.push({ x: clamp(x, 40, W - 40), y, text, col: col || '#fff', size: size || 12, life: 1 });
}

/* ---------- collision ---------- */
function circleRect(b, rx, ry, rw, rh) {
  const nx = clamp(b.x, rx, rx + rw), ny = clamp(b.y, ry, ry + rh);
  const dx = b.x - nx, dy = b.y - ny, d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return null;
  const d = Math.sqrt(d2);
  if (d > 1e-6) return { nx: dx / d, ny: dy / d, pen: R - d };
  const l = b.x - rx, r = rx + rw - b.x, t = b.y - ry, bt = ry + rh - b.y, m = Math.min(l, r, t, bt);
  if (m === l) return { nx: -1, ny: 0, pen: l + R };
  if (m === r) return { nx: 1, ny: 0, pen: r + R };
  if (m === t) return { nx: 0, ny: -1, pen: t + R };
  return { nx: 0, ny: 1, pen: bt + R };
}
function bounce(b, c) {
  b.x += c.nx * c.pen; b.y += c.ny * c.pen;
  const dot = b.vx * c.nx + b.vy * c.ny;
  if (dot < 0) { b.vx -= 2 * dot * c.nx; b.vy -= 2 * dot * c.ny; }
  fixAngle(b);
}
function fixAngle(b) {
  // tiny jitter breaks endless loops, and a minimum vertical speed stops flat-angle stalls
  const j = rand(-0.02, 0.02), cs = Math.cos(j), sn = Math.sin(j);
  const vx = b.vx * cs - b.vy * sn, vy = b.vx * sn + b.vy * cs; b.vx = vx; b.vy = vy;
  const sp = Math.hypot(b.vx, b.vy) || 1, minVy = 0.22 * sp;
  if (Math.abs(b.vy) < minVy) {
    b.vy = (b.vy < 0 ? -1 : 1) * minVy;
    b.vx = (b.vx < 0 ? -1 : 1) * Math.sqrt(sp * sp - minVy * minVy);
  }
}
function curSpeed() { return G.speed * G.boost * G.timeScale; }

function hitBlock(blk, ball, dmg) {
  if (blk.type === 'S' || !blk.alive) return;
  blk.hp -= dmg;
  if (blk.hp <= 0) killBlock(blk, ball);
  else { blk.flash = 1; sfx('hit'); }
}
function killBlock(blk, ball) {
  blk.alive = false; G.remaining--;
  const cx = blk.x + BW / 2, cy = blk.y + BH / 2;
  const col = blk.type === 'X' ? '#fb923c' : blk.type === 'M' ? '#fbbf24' : blk.maxhp === 3 ? '#f472b6' : blk.maxhp === 2 ? '#818cf8' : '#2dd4bf';
  burst(cx, cy, col, 12);
  const combo = ball ? ++ball.combo : 0;
  const pts = Math.round(10 * blk.maxhp * (ball && ball.od ? 3 : 1) * (1 + Math.min(combo, 20) * 0.05));
  addScore(pts);
  floatText(cx, cy, '+' + pts, ball && ball.od ? '#fdba74' : '#e2e8f0', 11);
  sfx('break', combo);
  if (blk.type === 'X') G.blasts.push({ x: cx, y: cy, r: 66, t: 0.07, dmg: 2, big: true });

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hitBtn(x, y) {
  for (const k in BTN) { const b = BTN[k]; if (Math.hypot(x - b.x, y - b.y) <= b.r + 6) return k; }
  return null;
}
function tap() {
  ac();
  if (G.state === 'menu') newGame();
  else if (G.state === 'serve') launch();
  else if (G.state === 'paused') resume();
  else if (G.state === 'over' && G.stateT > 0.7) newGame();
}
function toggleMute() { G.muted = !G.muted; try { localStorage.setItem('gatecrash.mute', G.muted ? '1' : '0'); } catch (e) {} }
const P = { down: false, sx: 0, sy: 0, lx: 0, moved: false, btn: null };
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  ac();
  const q = toLogical(e);
  P.down = true; P.sx = q.x; P.sy = q.y; P.lx = q.x; P.moved = false; P.btn = hitBtn(q.x, q.y);
  if (!P.btn && e.pointerType === 'mouse') G.pad.tx = clamp(q.x, G.pad.w / 2, W - G.pad.w / 2);
});
canvas.addEventListener('pointermove', e => {
  const q = toLogical(e);
  if (e.pointerType === 'mouse') { if (!P.btn) G.pad.tx = clamp(q.x, G.pad.w / 2, W - G.pad.w / 2); }
  else if (P.down && !P.btn) G.pad.tx = clamp(G.pad.tx + (q.x - P.lx) * 1.2, G.pad.w / 2, W - G.pad.w / 2);
  P.lx = q.x;
  if (P.down && Math.hypot(q.x - P.sx, q.y - P.sy) > 14) P.moved = true;
});
function pointerEnd(e) {
  if (!P.down) return; P.down = false;
  if (P.btn) {
    const q = toLogical(e);
    if (hitBtn(q.x, q.y) === P.btn) { if (P.btn === 'pause') (G.state === 'paused' ? resume() : pause()); else toggleMute(); }
    P.btn = null; return;
  }
  if (!P.moved) tap();
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', () => { P.down = false; P.btn = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { G.keys.l = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { G.keys.r = true; e.preventDefault(); }
  else if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) tap(); }
  else if (k === 'p' || k === 'P' || k === 'Escape') { if (G.state === 'paused') resume(); else pause(); }
  else if (k === 'm' || k === 'M') toggleMute();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') G.keys.l = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') G.keys.r = false;
});
window.addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- boot ---------- */
buildSprites();
resize();
G.gates = LEVELS[0].gates.map(g => ({ cx: g.cx, w: g.w, k: g.k, mv: g.mv || null, x: g.cx }));
updateGates();
(function preview() { // show level 1 behind the title card
  const L = LEVELS[0];
  L.rows.forEach((row, ri) => { for (let ci = 0; ci < COLS; ci++) { const ch = row[ci]; if (ch === '.' ) continue;
    const type = ch === 'M' ? 'M' : 'N'; const hp = (ch >= '1' && ch <= '3') ? +ch : 1;
    G.blocks.push({ x: BX0 + ci * BW, y: BY0 + ri * BH, hp, maxhp: hp, type, alive: true, flash: 0, lastP: -9 }); } });
})();
let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__gc = { G, update, draw, loadLevel, newGame, launch, tap, getLevel, LEVELS, applyOrb, pause, resume, W, H, PAD_Y, WALL_Y, WALL_B, R, BW, BH };
})();
</script>
